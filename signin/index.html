<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Certification of training — Drawer Box Specialties</title>
  <style>
    /* Printable OSHA training record.
       29 CFR 1910.132(f)(4) requires name, date(s), and subject.
       Type sizes follow OSHA/federal print practice: 12-pt body, 0.5-in margins,
       high-contrast black on white. OSHA does not mandate a typeface. */
    @page { size: letter; margin: 0.5in; }
    :root {
      --ink: #000;
      --muted: #222;
      --rule: #000;
      --band: #e6e6e6;
      --alt: #f3f3f3;
      --head: #003366;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12pt;
      line-height: 1.25;
      color: var(--ink);
      background: #d8d8d8;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      justify-content: space-between;
      padding: .6rem 1rem;
      background: var(--head);
      color: #fff;
    }
    .toolbar p { margin: 0; font-size: 10pt; letter-spacing: .04em; }
    .toolbar h1 { margin: .1rem 0 0; font-size: 14pt; }
    .actions { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
    button {
      border: 1px solid #fff;
      border-radius: 2px;
      padding: .4rem .75rem;
      font: 700 12pt/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
      background: #fff;
      color: var(--head);
    }
    button.ghost { background: transparent; color: #fff; }
    .status { color: #dbe7f3; font-size: 10pt; }
    .sheet {
      width: 8.5in;
      max-width: 100%;
      margin: 0.75rem auto 2rem;
      padding: 0.5in;
      background: #fff;
      color: #000;
      box-shadow: 0 0 0 1px #bbb;
    }
    .banner {
      border: 2px solid #000;
      padding: 8pt 10pt;
      margin-bottom: 10pt;
    }
    .banner .kicker {
      font-size: 10pt;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin: 0 0 2pt;
    }
    .banner h2 {
      margin: 0;
      font-size: 16pt;
      line-height: 1.15;
    }
    .banner .sub {
      margin: 4pt 0 0;
      font-size: 12pt;
    }
    .legal {
      font-size: 10pt;
      margin: 8pt 0 0;
    }
    .meta {
      display: grid;
      grid-template-columns: 1.4in 1fr 1.6in;
      gap: 10pt;
      margin: 10pt 0;
    }
    label {
      display: block;
      font-size: 10pt;
      font-weight: 700;
      margin-bottom: 2pt;
    }
    input, select {
      width: 100%;
      border: 0;
      border-bottom: 1pt solid #000;
      border-radius: 0;
      background: transparent;
      font: 12pt/1.2 Arial, Helvetica, sans-serif;
      color: #000;
      padding: 3pt 0;
      min-height: 18pt;
    }
    input:focus { outline: 2px solid var(--head); outline-offset: 1px; }
    .count { font-size: 12pt; align-self: end; padding-bottom: 4pt; font-weight: 700; }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1.5pt solid #000;
    }
    thead { display: table-header-group; }
    th {
      background: #000;
      color: #fff;
      font-size: 10pt;
      font-weight: 700;
      text-align: left;
      padding: 6pt 5pt;
    }
    td {
      padding: 1pt 5pt;
      border-bottom: 0.75pt solid #000;
      vertical-align: middle;
      font-size: 12pt;
      line-height: 1.15;
    }
    tr.dept td {
      background: var(--band);
      font-weight: 700;
      font-size: 11pt;
      padding: 2pt 5pt;
    }
    tr.alt td { background: var(--alt); }
    tr.person { page-break-inside: avoid; }
    .num { width: 0.4in; font-size: 10pt; }
    .dept-cell { width: 1.45in; font-size: 12pt; }
    .sig-cell { width: 2.6in; }
    .blank-name, .blank-dept { width: 100%; font-size: 12pt; min-height: 16pt; }
    .sig-pad { width: 100%; height: 28px; touch-action: none; cursor: crosshair; display: block; }
    .cert {
      margin-top: 12pt;
      border: 2px solid #000;
      padding: 8pt 10pt;
      page-break-inside: avoid;
    }
    .cert h3 { margin: 0 0 6pt; font-size: 12pt; text-transform: uppercase; }
    .cert p { margin: 0 0 8pt; font-size: 12pt; }
    .signoff {
      display: grid;
      grid-template-columns: 1fr 1.4in;
      gap: 12pt;
    }
    @media (max-width: 720px) {
      .sheet { padding: 0.6rem; box-shadow: none; }
      .meta, .signoff { grid-template-columns: 1fr 1fr; }
    }
    @media print {
      .toolbar { display: none !important; }
      body { background: #fff; }
      .sheet {
        width: auto;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
      input { border-bottom: 1pt solid #000; }
      th, tr.dept td, tr.alt td {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <p>DRAWER BOX SPECIALTIES</p>
      <h1>OSHA training attendance record</h1>
    </div>
    <div class="actions">
      <span class="status" id="status">Saved on this computer</span>
      <button type="button" class="ghost" id="clear">Clear signatures</button>
      <button type="button" id="print">Print / save PDF</button>
    </div>
  </div>

  <main class="sheet">
    <form id="form" autocomplete="off">
      <div class="meta">
        <div>
          <label for="date">Date of training</label>
          <input id="date" name="date" type="date" required />
        </div>
        <div>
          <label for="topic">Subject of certification</label>
          <input id="topic" name="topic" type="text" placeholder="PPE or material handling" />
        </div>
        <div>
          <label for="facilitator">Trainer / certifying person</label>
          <input id="facilitator" name="facilitator" type="text" />
        </div>
      </div>

      <p class="count" id="count">0 employees signed</p>

      <table>
        <thead>
          <tr>
            <th class="num">No.</th>
            <th>Employee name</th>
            <th>Department</th>
            <th>Employee signature</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <section class="cert">
        <h3>Trainer certification</h3>
        <p>
          I certify that each employee who signed has received and understood
          the training on the subject listed.
        </p>
        <div class="signoff">
          <div>
            <label>Trainer signature</label>
            <canvas id="trainerPad" class="sig-pad" width="420" height="36"></canvas>
          </div>
          <div>
            <label for="trainerTitle">Title</label>
            <input id="trainerTitle" name="trainerTitle" type="text" />
          </div>
        </div>
      </section>
    </form>
  </main>

  <script>
    const DEPT_ORDER = [
      "Rough Mill", "Mill", "CNC", "Custom", "Pre Assembly",
      "Assembly", "Shipping", "Trucking", "Maintenance", "Manufacturing"
    ];
    const EMPLOYEES = [
      ["AGUILAR VILLANUEVA, MIGUEL", "Rough Mill"],
      ["LUCERO MENDEZ, MANUEL", "Rough Mill"],
      ["PATRICK, JACOB", "Rough Mill"],
      ["PEREZ, RAMIRO H", "Rough Mill"],
      ["VASQUEZ, FRANCISCO", "Rough Mill"],
      ["CLIMACO BELLO, PEDRO", "Mill"],
      ["CLIMACO, MARCO", "Mill"],
      ["LACY, ANTHONY", "Mill"],
      ["MAYORGA, JOEL SANCHEZ", "Mill"],
      ["OLIVAREZ, STEVEN", "Mill"],
      ["OLMOS, JORGE", "Mill"],
      ["PINEDO, GONZALO", "Mill"],
      ["ROMERO FLORES, JAVIER", "Mill"],
      ["MALDONADO, HENRY", "CNC"],
      ["VILLAFAN SUAREZ, JOSE A", "CNC"],
      ["CORTEZ, EUGENIO", "Custom"],
      ["FLORES, KAREN", "Custom"],
      ["BONILLA, NELSON E", "Pre Assembly"],
      ["BULFRANO, ANGEL", "Pre Assembly"],
      ["ESPINOZA, JESUS", "Pre Assembly"],
      ["GARCIA, ROGELIO", "Pre Assembly"],
      ["JIMENEZ, VICENTE", "Pre Assembly"],
      ["ORTIZ PINEDA, TOMAS", "Pre Assembly"],
      ["PATINO-RODRIGUEZ, JOSE", "Pre Assembly"],
      ["SOLORZANO VELIZ, FRANCISCO", "Pre Assembly"],
      ["BARRERA CABRERA, ENRIQUE", "Assembly"],
      ["BEATRIZ, HELADIA", "Assembly"],
      ["CARRANZA, RUBEN", "Assembly"],
      ["CUYUCH, ROMEO", "Assembly"],
      ["GONZALEZ, DANIEL", "Assembly"],
      ["MARTINEZ RESENDIZ, MARCELO", "Assembly"],
      ["MARTINEZ TORRES, ALFREDO", "Assembly"],
      ["RESENDIZ MUNOZ, JUAN", "Assembly"],
      ["ROSAS, VICTOR", "Assembly"],
      ["VENTURA JIMENEZ, DANIEL", "Assembly"],
      ["CARRENO TRUJILLO, DANIEL", "Shipping"],
      ["ELIZARRARAZ, JOSE R", "Shipping"],
      ["ARELLANO, NOEL", "Trucking"],
      ["CEJA, RODOLFO S", "Trucking"],
      ["SOPONRATH, JAMIE TONY", "Trucking"],
      ["MAGDALENO DIAZ, CRISTIAN", "Maintenance"],
      ["VORN, TONY", "Maintenance"],
      ["RODRIGUEZ, CALIXTO", "Manufacturing"]
    ];
    const EXTRA = 6;
    const STORAGE = "dbs-signin-osha";

    const dateEl = document.getElementById("date");
    const topicEl = document.getElementById("topic");
    const facilitatorEl = document.getElementById("facilitator");
    const trainerTitleEl = document.getElementById("trainerTitle");
    let trainerSig = "";
    const rowsEl = document.getElementById("rows");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");

    function todayISO() {
      const d = new Date();
      const off = d.getTimezoneOffset();
      return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
    }

    function grouped() {
      const map = new Map(DEPT_ORDER.map((d) => [d, []]));
      for (const [name, dept] of EMPLOYEES) {
        if (!map.has(dept)) map.set(dept, []);
        map.get(dept).push(name);
      }
      return DEPT_ORDER.filter((d) => map.get(d).length).map((d) => [d, map.get(d)]);
    }

    function renderRows() {
      const frag = document.createDocumentFragment();
      let n = 0;
      for (const [dept, names] of grouped()) {
        const band = document.createElement("tr");
        band.className = "dept";
        band.innerHTML = `<td colspan="4">${dept} — ${names.length} employees</td>`;
        frag.appendChild(band);
        names.forEach((name, i) => {
          n += 1;
          frag.appendChild(personRow(n, name, dept, false, i % 2 === 1));
        });
      }
      for (let i = 0; i < EXTRA; i += 1) {
        n += 1;
        frag.appendChild(personRow(n, "", "", true, i % 2 === 1));
      }
      rowsEl.replaceChildren(frag);
    }

    function personRow(n, name, dept, extra, alt) {
      const tr = document.createElement("tr");
      tr.className = "person" + (alt ? " alt" : "");
      tr.dataset.n = String(n);
      const nameCell = extra
        ? `<input class="blank-name" data-field="name" placeholder="Employee name" />`
        : name;
      const deptCell = extra
        ? `<input class="blank-dept" data-field="dept" placeholder="Department" />`
        : dept;
      tr.innerHTML = `
        <td class="num">${n}</td>
        <td>${nameCell}</td>
        <td class="dept-cell">${deptCell}</td>
        <td class="sig-cell"><canvas class="sig-pad" data-field="sig" width="320" height="36"></canvas></td>
      `;
      return tr;
    }

    function key() {
      return `${STORAGE}:${dateEl.value || todayISO()}`;
    }

    function bindPad(canvas, getValue, setValue) {
      const ctx = canvas.getContext("2d");
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#111";
      let drawing = false;
      let last = null;
      function pos(e) {
        const r = canvas.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
      }
      function start(e) {
        e.preventDefault();
        drawing = true;
        last = pos(e);
      }
      function move(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = pos(e);
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        last = p;
      }
      function end(e) {
        if (!drawing) return;
        e.preventDefault();
        drawing = false;
        setValue(canvas.toDataURL("image/png"));
        save();
        updateCount();
      }
      canvas.addEventListener("pointerdown", start);
      canvas.addEventListener("pointermove", move);
      canvas.addEventListener("pointerup", end);
      canvas.addEventListener("pointercancel", end);
      const stored = getValue();
      if (stored && stored.startsWith("data:image")) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        img.src = stored;
      }
    }

    function collect() {
      const rows = [...rowsEl.querySelectorAll("tr[data-n]")].map((tr) => ({
        n: tr.dataset.n,
        name: tr.querySelector("[data-field=name]")?.value || "",
        dept: tr.querySelector("[data-field=dept]")?.value || "",
        sig: tr.querySelector("[data-field=sig]")?.dataset.value || "",
      }));
      return {
        date: dateEl.value,
        topic: topicEl.value,
        facilitator: facilitatorEl.value,
        trainerSig,
        trainerTitle: trainerTitleEl.value,
        rows,
      };
    }

    function apply(data) {
      if (!data) {
        topicEl.value = "";
        facilitatorEl.value = "";
        trainerSig = "";
        trainerTitleEl.value = "";
        bindAllPads();
        updateCount();
        return;
      }
      topicEl.value = data.topic || "";
      facilitatorEl.value = data.facilitator || "";
      trainerSig = data.trainerSig || "";
      trainerTitleEl.value = data.trainerTitle || "";
      const byN = new Map((data.rows || []).map((r) => [String(r.n), r]));
      rowsEl.querySelectorAll("tr[data-n]").forEach((tr) => {
        const row = byN.get(tr.dataset.n);
        const name = tr.querySelector("[data-field=name]");
        const dept = tr.querySelector("[data-field=dept]");
        const sig = tr.querySelector("[data-field=sig]");
        if (name) name.value = row?.name || "";
        if (dept) dept.value = row?.dept || "";
        if (sig) sig.dataset.value = row?.sig || "";
      });
      bindAllPads();
      updateCount();
    }

    function bindAllPads() {
      rowsEl.querySelectorAll("[data-field=sig]").forEach((canvas) => {
        const next = canvas.cloneNode(true);
        canvas.replaceWith(next);
        next.dataset.value = canvas.dataset.value || "";
        bindPad(next, () => next.dataset.value || "", (v) => { next.dataset.value = v; });
      });
      const trainerCanvas = document.getElementById("trainerPad");
      if (trainerCanvas) {
        const next = trainerCanvas.cloneNode(true);
        next.id = "trainerPad";
        trainerCanvas.replaceWith(next);
        bindPad(next, () => trainerSig, (v) => { trainerSig = v; });
      }
    }

    function save() {
      localStorage.setItem(key(), JSON.stringify(collect()));
      statusEl.textContent = "Saved on this computer";
    }

    function load() {
      const raw = localStorage.getItem(key());
      apply(raw ? JSON.parse(raw) : null);
    }

    function updateCount() {
      const signed = [...rowsEl.querySelectorAll("[data-field=sig]")].filter((el) => (el.dataset.value || "").startsWith("data:image")).length;
      countEl.textContent = `${signed} employees signed`;
    }

    dateEl.value = todayISO();
    renderRows();
    load();

    document.getElementById("form").addEventListener("input", (e) => {
      if (e.target.id === "date") {
        load();
        return;
      }
      updateCount();
      save();
    });
    document.getElementById("print").addEventListener("click", () => window.print());
    document.getElementById("clear").addEventListener("click", () => {
      rowsEl.querySelectorAll("[data-field=sig]").forEach((el) => { el.dataset.value = ""; });
      trainerSig = "";
      bindAllPads();
      updateCount();
      save();
    });
  </script>
</body>
</html>
